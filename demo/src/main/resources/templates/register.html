<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Register - Defender</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.gstatic.com/" crossorigin />
    <link href="https://fonts.googleapis.com/css2?display=swap&family=Noto+Sans:wght@400;500;700;900&family=Space+Grotesk:wght@400;500;700" rel="stylesheet" />

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

    <style>
        body {
            font-family: 'Space Grotesk', 'Noto Sans', sans-serif;
            margin: 0;
            background-image: url('/images/register_image.jpg');
            background-size: cover;
            background-position: center;
            min-height: 100vh;
            color: white;
        }
        header {
            background-color: black;
            border-bottom: 1px solid #e5e7eb;
            position: relative;
            z-index: 10;
        }
    </style>
</head>

<body class="flex flex-col min-h-screen">

<!-- Header -->
<header>
    <div class="absolute top-[75%%] right-10">
        <img th:src="@{/images/lr_logo.png}" alt="Land Rover Logo" class="w-24 h-24 object-contain" />
    </div>
</header>

<!-- Main content -->
<main class="flex-grow flex items-center justify-center px-4">

    <div class="bg-black bg-opacity-70 p-8 rounded-lg max-w-md w-full shadow-lg">

        <h2 class="text-3xl font-extrabold mb-6 text-white text-center">Register</h2>

        <form th:action="@{/register}" th:object="${user}" method="post" class="space-y-6">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

            <div>
                <label for="username" class="block text-sm font-medium text-gray-200">Username</label>
                <input type="text" th:field="*{username}" id="username" required
                       class="mt-1 block w-full rounded-md border border-gray-300 px-3 py-2 text-black focus:outline-none focus:ring-2 focus:ring-green-500" />
            </div>

            <div>
                <label for="password" class="block text-sm font-medium text-gray-200">Password</label>
                <input type="password" th:field="*{password}" id="password" required
                       class="mt-1 block w-full rounded-md border border-gray-300 px-3 py-2 text-black focus:outline-none focus:ring-2 focus:ring-green-500" />
            </div>

            <button type="submit"
                    class="w-full bg-green-600 hover:bg-green-700 text-white font-semibold py-2 rounded-md transition">
                Register
            </button>

        </form>
        <div th:if="${registrationError}" class="mb-4 text-red-500 font-semibold text-center">
            <p th:text="${registrationError}"></p>
        </div>

        <p class="mt-6 text-center text-gray-300">
            Already have an account?
            <a th:href="@{/login}" class="text-green-400 hover:text-green-600 font-semibold">Login</a>
        </p>

    </div>

</main>

</body>
</html>
