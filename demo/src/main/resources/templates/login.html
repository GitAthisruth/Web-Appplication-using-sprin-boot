<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Login - Defender</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.gstatic.com/" crossorigin />
    <link href="https://fonts.googleapis.com/css2?display=swap&family=Noto+Sans:wght@400;500;700;900&family=Space+Grotesk:wght@400;500;700" rel="stylesheet" />

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

    <style>
        body {
            font-family: 'Space Grotesk', 'Noto Sans', sans-serif;
            margin: 0;
            /* Full background image */
            background-image: url('/images/login_image.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            min-height: 100vh;
            color: white;
        }
        header {
            background-color: transparent; /* No header background */
            border-bottom: none;
            position: relative;
            z-index: 10;
        }
        /* Semi-transparent background for form container */
        .form-container {
            background-color: rgba(0, 0, 0, 0.5);
        }
    </style>
</head>

<body class="flex flex-col min-h-screen">

<header>
    <div class="absolute top-[75%%] right-10">
        <img th:src="@{/images/lr_logo.png}" alt="Land Rover Logo" class="w-24 h-24 object-contain" />
    </div>
</header>

<!-- Main content -->
<main class="flex-grow flex items-center justify-center px-4">

    <div class="form-container p-8 rounded-lg max-w-md w-full shadow-lg">

        <h2 class="text-3xl font-extrabold mb-6 text-white text-center">Login</h2>

        <form th:action="@{/login}" method="post" class="space-y-6">

            <div>
                <label for="username" class="block text-sm font-medium text-gray-200">Username</label>
                <input type="text" id="username" name="username" required
                       class="mt-1 block w-full rounded-md border border-gray-300 px-3 py-2 text-black focus:outline-none focus:ring-2 focus:ring-indigo-500" />
            </div>

            <div>
                <label for="password" class="block text-sm font-medium text-gray-200">Password</label>
                <input type="password" id="password" name="password" required
                       class="mt-1 block w-full rounded-md border border-gray-300 px-3 py-2 text-black focus:outline-none focus:ring-2 focus:ring-indigo-500" />
            </div>

            <button type="submit"
                    class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2 rounded-md transition">
                Login
            </button>

        </form>

        <p class="mt-6 text-center text-gray-300">
            Don't have an account?
            <a th:href="@{/register}" class="text-indigo-400 hover:text-indigo-600 font-semibold">Register here</a>
        </p>

    </div>

</main>

</body>
</html>
